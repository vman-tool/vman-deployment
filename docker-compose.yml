
services:
  nginx:
    image: nginx:alpine
    ports:
      - "82:80"   # Production: reverse proxy on host connects to port 82
                  # Local testing: change to "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./.htpasswd:/etc/nginx/.htpasswd:ro  # For Flower basic auth
    depends_on:
      - backend
      - flower
    restart: always

  frontend:
    image: ilyatuu/vman3_frontend
    platform: linux/amd64
    volumes:
      - ./config.json:/usr/share/nginx/html/assets/config.json
    restart: always

  backend:
    image: ilyatuu/vman3_backend:latest
    platform: linux/amd64
    command:
      [
        "gunicorn",
        "-k",
        "uvicorn.workers.UvicornWorker",
        "-w",
        "2",
        "-b",
        "0.0.0.0:8080",
        "--timeout",
        "120",
        "app.main:app"
      ]
    # ports:
    #   - "8080:8080"  # Uncomment only for local debugging — do not expose in production
    volumes:
      - ./ccva_files:/app/ccva_files
      - ./settings.json:/vman3/settings.json
      - ./uploads:/vman3/app/uploads
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      arangodb:
        condition: service_healthy
    restart: always

  arangodb:
    image: arangodb/arangodb:3.12.2
    # ports:
    #   - "8529:8529"  # Uncomment only for local debugging — do not expose in production
    env_file:
      - .env
    volumes:
      - vman3db:/var/lib/arangodb3
    command:
      - arangod
      - --server.endpoint=tcp://0.0.0.0:8529
      - --rocksdb.write-buffer-size=128MB
      - --rocksdb.total-write-buffer-size=512MB
    healthcheck:
      test: ["CMD-SHELL", "wget -S -O /dev/null http://127.0.0.1:8529/ 2>&1 | grep -q HTTP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: always

  redis:
    image: redis:latest
    command: redis-server --requirepass vman@1029
    # ports:
    #   - "6370:6379"  # Uncomment only for local debugging — do not expose in production
    restart: always

  # Celery worker for background task processing (CCVA, ODK sync)
  celery-worker:
    image: ilyatuu/vman3_backend:latest
    platform: linux/amd64
    command:
      [
        "python",
        "-m",
        "celery",
        "-A",
        "app.celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=4",
        "-Q",
        "celery,ccva,odk"
      ]
    volumes:
      - ./ccva_files:/app/ccva_files
      - ./uploads:/vman3/app/uploads
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
    depends_on:
      - redis
      - arangodb
    restart: always

  # Flower - Celery monitoring UI (dedicated image, much lighter)
  flower:
    image: mher/flower:master
    platform: linux/amd64
    command:
      [
        "celery",
        "--broker=redis://:vman%401029@redis:6379/0",
        "flower",
        "--port=5555",
        "--url-prefix=flower"
      ]
    # Accessible via nginx at /flower (basic auth protected)
    # ports:
    #   - "5555:5555"
    depends_on:
      - redis
      - celery-worker
    restart: always

    
#  Uncomment if you need local copy of the documentation (Not Recommended)
#  Ensure nginx.conf is updated as well
    
# docs:
#     build: ./vman3-documentation
